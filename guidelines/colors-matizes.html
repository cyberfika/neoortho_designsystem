<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;padding:0}body{font-family:var(--font-body);background:#fff;padding:18px 20px;color:var(--text-body)}.r{display:grid;grid-template-columns:repeat(5,1fr);margin-bottom:8px}.c{height:44px;display:grid;place-items:center;font-size:11px;font-weight:600}</style></head><body>
<div class="r"><div class="c" style="background:var(--purple-700-100);color:#fff">100%</div><div class="c" style="background:var(--purple-700-80);color:#fff">80%</div><div class="c" style="background:var(--purple-700-60);color:#fff">60%</div><div class="c" style="background:var(--purple-700-40);color:var(--purple-900)">40%</div><div class="c" style="background:var(--purple-700-20);color:var(--purple-900)">20%</div></div>
<div class="r"><div class="c" style="background:var(--teal-500-100);color:#fff">100%</div><div class="c" style="background:var(--teal-500-80);color:#fff">80%</div><div class="c" style="background:var(--teal-500-60);color:#fff">60%</div><div class="c" style="background:var(--teal-500-40);color:var(--purple-900)">40%</div><div class="c" style="background:var(--teal-500-20);color:var(--purple-900)">20%</div></div>
<div class="r" style="margin-bottom:0"><div class="c" style="background:var(--purple-light-100);color:#fff">100%</div><div class="c" style="background:var(--purple-light-80);color:#fff">80%</div><div class="c" style="background:var(--purple-light-60);color:#fff">60%</div><div class="c" style="background:var(--purple-light-40);color:var(--purple-900)">40%</div><div class="c" style="background:var(--purple-light-20);color:var(--purple-900)">20%</div></div>
</body></html>
