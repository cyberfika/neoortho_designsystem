<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;padding:0}body{font-family:var(--font-body);background:#fff;padding:18px 20px;color:var(--text-body)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.b{height:130px;border-radius:var(--radius-md);position:relative;overflow:hidden;display:grid;align-items:end;color:#fff;font-size:11px;font-weight:600}.b span{padding:8px 10px;position:relative}</style></head><body><div class="g">
<div class="b" style="background:var(--gradient-purple-deep)"><span>--gradient-purple-deep</span></div>
<div class="b" style="background:var(--gradient-light-field);color:var(--purple-800)"><span>--gradient-light-field</span></div>
<div class="b" style="background:url('../assets/photos/photo-hands.png') center/cover"><div style="position:absolute;inset:0;background:var(--gradient-protection)"></div><span>--gradient-protection</span></div>
</div></body></html>
