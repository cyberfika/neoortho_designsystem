<!-- @dsCard group="Colors" viewport="700x160" name="Cores das linhas" subtitle="Trauma, Coluna, CMF, Personalizados — pairing to confirm" -->
<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;padding:0}body{font-family:var(--font-body);background:#fff;padding:18px 20px;color:var(--text-body)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(39,20,76,.10)}.hex{font-size:11px;font-weight:600;color:var(--text-strong);letter-spacing:.02em}.nm{font-size:11px;color:var(--text-muted)}.grid{display:grid;gap:12px}.lbl{font-size:11px;font-weight:600;letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-strong)}</style></head><body><div class="grid" style="grid-template-columns:repeat(4,1fr)">
<div class="sw"><div class="chip" style="background:var(--line-trauma)"></div><span class="lbl">Trauma</span><span class="hex">#731EA0</span></div>
<div class="sw"><div class="chip" style="background:var(--line-coluna)"></div><span class="lbl">Coluna</span><span class="hex">#AD60EA</span></div>
<div class="sw"><div class="chip" style="background:var(--line-cmf)"></div><span class="lbl">CMF</span><span class="hex">#00B0B9</span></div>
<div class="sw"><div class="chip" style="background:var(--line-custom)"></div><span class="lbl">Personalizados</span><span class="hex">#84E9A7</span></div>
</div></body></html>
