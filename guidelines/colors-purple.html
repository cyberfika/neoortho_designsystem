<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0;padding:0}body{font-family:var(--font-body);background:#fff;padding:18px 20px;color:var(--text-body)}.sw{display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(39,20,76,.10)}.hex{font-size:11px;font-weight:600;color:var(--text-strong);letter-spacing:.02em}.nm{font-size:11px;color:var(--text-muted)}.grid{display:grid;gap:12px}</style></head><body><div class="grid" style="grid-template-columns:repeat(5,1fr)">
<div class="sw"><div class="chip" style="background:var(--purple-900)"></div><span class="hex">#27144C</span><span class="nm">purple-900</span></div>
<div class="sw"><div class="chip" style="background:var(--purple-800)"></div><span class="hex">#3B2368</span><span class="nm">purple-800</span></div>
<div class="sw"><div class="chip" style="background:var(--purple-700)"></div><span class="hex">#582C83</span><span class="nm">purple-700 · PANTONE 268 C</span></div>
<div class="sw"><div class="chip" style="background:var(--purple-600)"></div><span class="hex">#6951B9</span><span class="nm">purple-600</span></div>
<div class="sw"><div class="chip" style="background:var(--purple-500)"></div><span class="hex">#7A5DD6</span><span class="nm">purple-500</span></div>
</div></body></html>
